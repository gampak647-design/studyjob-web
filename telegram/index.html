<!DOCTYPE html>
<html lang="ru">
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Study Job — Telegram Mini App">
  <meta name="theme-color" content="#101216">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="manifest" href="/manifest.json">
  <title>Study Job</title>

  <script>
    (function () {
      var BUILD = 'studyjob-auth-entry-v1';
      var KEY = 'studyjob_tg_cache_build';
      var current = new URL(location.href);
      var alreadyReset = current.searchParams.get('cache_reset') === BUILD;
      try {
        if (localStorage.getItem(KEY) === BUILD || alreadyReset) {
          localStorage.setItem(KEY, BUILD);
          return;
        }
      } catch (_) {
        if (alreadyReset) return;
      }

      try { window.stop(); } catch (_) {}

      Promise.resolve().then(function () {
        var work = [];
        try {
          if ('serviceWorker' in navigator) {
            work.push(
              navigator.serviceWorker.getRegistrations().then(function (registrations) {
                return Promise.all(registrations.map(function (registration) {
                  return registration.unregister();
                }));
              })
            );
          }
          if ('caches' in window) {
            work.push(
              caches.keys().then(function (names) {
                return Promise.all(names.map(function (name) {
                  return caches.delete(name);
                }));
              })
            );
          }
        } catch (_) {}
        return Promise.all(work).catch(function () {});
      }).then(function () {
        try { localStorage.setItem(KEY, BUILD); } catch (_) {}
        current.searchParams.set('cache_reset', BUILD);
        location.replace(current.pathname + '?' + current.searchParams.toString() + current.hash);
      });
    })();
  </script>

  <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
  <script src="/studyjob_telegram.js?v=auth-entry-v1" defer></script>
  <script src="/studyjob_turnstile.js?v=web2_cache_reset_20260831" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js" defer></script>
  <script src="/studyjob_ocr.js?v=picker8_warm1800_20260830" defer></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #101216;
      color: #f8f9ff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #studyjob-web-loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 35%, rgba(83, 106, 255, .12), transparent 30%),
        #101216;
      transition: opacity .28s ease, visibility .28s ease;
    }

    #studyjob-web-loader.done {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .studyjob-loader-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      transform: translateY(-2vh);
    }

    .studyjob-loader-logo {
      width: 104px;
      height: 104px;
      object-fit: contain;
      filter: drop-shadow(0 18px 32px rgba(0, 91, 255, .18));
    }

    .studyjob-loader-title {
      margin: 0;
      font-size: 23px;
      font-weight: 800;
      letter-spacing: -.02em;
    }

    .studyjob-loader-line {
      width: 92px;
      height: 4px;
      border-radius: 99px;
      overflow: hidden;
      background: rgba(100, 110, 140, .15);
    }

    .studyjob-loader-line::after {
      content: "";
      display: block;
      width: 45%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #6377ff, #31a8ff);
      animation: studyjob-loading 1s ease-in-out infinite alternate;
    }

    @keyframes studyjob-loading {
      from { transform: translateX(-10%); }
      to { transform: translateX(130%); }
    }
  </style>
</head>
<body>
  <div id="studyjob-web-loader" aria-label="Study Job загружается">
    <div class="studyjob-loader-card">
      <img class="studyjob-loader-logo" src="/icons/Icon-512.png" alt="Study Job">
      <p class="studyjob-loader-title">Study Job</p>
      <div class="studyjob-loader-line" aria-hidden="true"></div>
    </div>
  </div>

  <script src="/studyjob_bootstrap.js?v=auth-entry-v1" defer></script>
</body>
</html>
