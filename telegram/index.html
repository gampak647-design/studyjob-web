<!DOCTYPE html>
<html lang="ru">
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Study Job — Telegram Mini App">
  <meta name="theme-color" content="#101216">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" type="image/png" href="/favicon.png">
  <title>Study Job</title>
  <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
  <script>
    (function () {
      var nativeFetch = window.fetch.bind(window);
      window.fetch = function (input, init) {
        try {
          var rawUrl = typeof input === 'string' ? input : String(input && input.url || '');
          if (rawUrl.indexOf('/functions/v1/telegram-sso') !== -1) {
            var next = Object.assign({}, init || {});
            next.headers = {
              'Accept': 'application/json',
              'Content-Type': 'text/plain;charset=UTF-8'
            };
            return nativeFetch(input, next);
          }
        } catch (_) {}
        return nativeFetch(input, init);
      };
    })();
  </script>
  <script>
    (function () {
      var DEEP_LINK_KEY = 'studyjob_pending_deeplink_v1';

      function hasSessionHash() {
        try {
          var p = new URLSearchParams(String(location.hash || '').replace(/^#/, ''));
          return Boolean(p.get('access_token') && p.get('refresh_token'));
        } catch (_) {
          return false;
        }
      }

      function cleanDeepLink(search) {
        try {
          var source = search instanceof URLSearchParams ? search : new URLSearchParams(search || '');
          var target = String(source.get('sj_target') || '').trim().toLowerCase();
          var id = String(source.get('sj_id') || '').trim();
          if (!target) return '';

          var allowed = {
            home: true,
            notifications: true,
            task: true,
            task_chat: true,
            task_rating: true,
            service: true,
            service_order: true,
            service_order_chat: true,
            service_order_rating: true,
            schedule: true,
            student_verification: true,
            admin_student_verification: true,
            creation_restriction: true
          };
          if (!allowed[target]) return '';

          var needsId = target === 'task' || target === 'task_chat' || target === 'task_rating' ||
            target === 'service' || target === 'service_order' ||
            target === 'service_order_chat' || target === 'service_order_rating';
          if (needsId && !/^\d+$/.test(id)) return '';

          var result = new URLSearchParams();
          result.set('sj_target', target);
          if (needsId) result.set('sj_id', id);
          return result.toString();
        } catch (_) {
          return '';
        }
      }

      function saveDeepLinkFromUrl() {
        var route = cleanDeepLink(location.search);
        if (!route) return;
        try { sessionStorage.setItem(DEEP_LINK_KEY, route); } catch (_) {}
      }

      function pendingDeepLink() {
        var current = cleanDeepLink(location.search);
        if (current) return current;
        try { return cleanDeepLink(sessionStorage.getItem(DEEP_LINK_KEY) || ''); } catch (_) { return ''; }
      }

      function appendDeepLink(url) {
        var route = pendingDeepLink();
        if (!route) return url;
        var params = new URLSearchParams(route);
        var target = params.get('sj_target');
        var id = params.get('sj_id');
        if (target) url.searchParams.set('sj_target', target);
        if (id) url.searchParams.set('sj_id', id);
        return url;
      }

      function handSessionToFlutter() {
        if (!hasSessionHash()) return;
        var url = new URL('/', location.origin);
        url.searchParams.set('tg_auth', '1');
        appendDeepLink(url);
        try { sessionStorage.removeItem(DEEP_LINK_KEY); } catch (_) {}
        location.replace(url.pathname + '?' + url.searchParams.toString() + location.hash);
      }

      saveDeepLinkFromUrl();
      window.addEventListener('hashchange', handSessionToFlutter);
      handSessionToFlutter();

      window.addEventListener('DOMContentLoaded', function () {
        setTimeout(function () {
          var gate = document.getElementById('sj-tg-gate');
          var card = document.getElementById('sj-tg-card');
          if (!gate || !card || !card.querySelector('.sj-tg-progress')) return;
          card.innerHTML =
            '<span class="sj-tg-kicker">Telegram Mini App</span>' +
            '<h1 class="sj-tg-title">Вход не завершился</h1>' +
            '<p class="sj-tg-subtitle">Повтори вход через Telegram. Обычный вход внутри Mini App отключён.</p>' +
            '<button class="sj-tg-btn sj-tg-btn-primary" id="sj-tg-watchdog-retry" type="button">Повторить через Telegram</button>';
          var retry = document.getElementById('sj-tg-watchdog-retry');
          if (retry) retry.onclick = function () {
            var url = new URL('/telegram/', location.origin);
            appendDeepLink(url);
            url.searchParams.set('retry', String(Date.now()));
            location.replace(url.pathname + '?' + url.searchParams.toString());
          };
        }, 12000);
      });
    })();
  </script>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101216;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    #studyjob-web-loader{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,rgba(83,106,255,.12),transparent 30%),#101216;color:#f8f9ff;transition:opacity .28s ease,visibility .28s ease}
    #studyjob-web-loader.done{opacity:0;visibility:hidden;pointer-events:none}
    .studyjob-loader-card{display:flex;flex-direction:column;align-items:center;gap:14px;transform:translateY(-2vh)}
    .studyjob-loader-logo{width:104px;height:104px;object-fit:contain;filter:drop-shadow(0 18px 32px rgba(0,91,255,.18))}
    .studyjob-loader-title{margin:0;font-size:23px;font-weight:800;letter-spacing:-.02em}
    .studyjob-loader-line{width:92px;height:4px;border-radius:99px;overflow:hidden;background:rgba(100,110,140,.15)}
    .studyjob-loader-line::after{content:"";display:block;width:45%;height:100%;border-radius:inherit;background:linear-gradient(90deg,#6377ff,#31a8ff);animation:studyjob-loading 1s ease-in-out infinite alternate}
    @keyframes studyjob-loading{from{transform:translateX(-10%)}to{transform:translateX(130%)}}
  </style>
</head>
<body>
  <div id="studyjob-web-loader" aria-label="Study Job загружается">
    <div class="studyjob-loader-card">
      <img class="studyjob-loader-logo" src="/icons/Icon-512.png" alt="Study Job">
      <p class="studyjob-loader-title">Study Job</p>
      <div class="studyjob-loader-line" aria-hidden="true"></div>
    </div>
  </div>
  <script src="/studyjob_telegram_runtime.js?v=11.22.1" defer></script>
  <script src="/studyjob_first_launch.js?v=1" defer></script>
  <script src="/studyjob_bootstrap.js?v=11.22.1" defer></script>
</body>
</html>
