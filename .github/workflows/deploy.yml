name: Deploy Study Job Web

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deploy repository
        uses: actions/checkout@v4

      - name: Unpack ready Study Job web build
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site
          python3 - <<'PY'
          import shutil
          import stat
          from pathlib import Path
          from zipfile import ZipFile

          archive = Path('StudyJob_WEB_READY.zip')
          root = Path('_site').resolve()

          with ZipFile(archive) as zip_file:
              for info in zip_file.infolist():
                  raw_name = info.filename
                  name = raw_name.replace('\\', '/')
                  parts = [part for part in name.split('/') if part not in ('', '.')]

                  if not parts:
                      continue
                  if name.startswith('/') or any(part == '..' for part in parts):
                      raise RuntimeError(f'Unsafe ZIP entry: {raw_name!r}')

                  mode = (info.external_attr >> 16) & 0xFFFF
                  if mode and stat.S_ISLNK(mode):
                      raise RuntimeError(f'Symlink ZIP entry is not allowed: {raw_name!r}')

                  target = root.joinpath(*parts)
                  resolved = target.resolve()
                  if resolved != root and root not in resolved.parents:
                      raise RuntimeError(f'ZIP entry escapes destination: {raw_name!r}')

                  if info.is_dir() or name.endswith('/') or name.endswith('\\'):
                      target.mkdir(parents=True, exist_ok=True)
                      continue

                  target.parent.mkdir(parents=True, exist_ok=True)
                  with zip_file.open(info) as source, target.open('wb') as destination:
                      shutil.copyfileobj(source, destination)
          PY
          touch _site/.nojekyll
          test -f _site/index.html
          test -f _site/main.dart.js
          test -f _site/studyjob_telegram.js

      - name: Overlay Telegram Mini App files
        run: |
          mkdir -p _site/telegram
          cp telegram/index.html _site/telegram/index.html
          cp studyjob_telegram_runtime.js _site/studyjob_telegram_runtime.js
          cp studyjob_first_launch.js _site/studyjob_first_launch.js
          cp studyjob_telegram.js _site/studyjob_telegram.js
          test -f _site/telegram/index.html
          test -f _site/studyjob_telegram_runtime.js
          test -f _site/studyjob_first_launch.js
          test -f _site/studyjob_telegram.js
          grep -q 'disableVerticalSwipes' _site/studyjob_telegram.js
          grep -q 'currentTelegram' _site/studyjob_telegram.js
          grep -q 'Создать аккаунт Study Job' _site/studyjob_first_launch.js

      - name: Apply Telegram SSO no-preflight hotfix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          runtime_path = Path('_site/studyjob_telegram_runtime.js')
          runtime = runtime_path.read_text(encoding='utf-8')

          old = '\n'.join([
              "      response = await fetch(url, {",
              "        method: 'POST',",
              "        cache: 'no-store',",
              "        headers: Object.assign({",
              "          'Content-Type': 'application/json',",
              "          'Accept': 'application/json',",
              "          'apikey': PUBLISHABLE_KEY,",
              "        }, accessToken ? { 'Authorization': 'Bearer ' + accessToken } : {}),",
              "        body: JSON.stringify(body),",
              "      });",
          ])

          new = '\n'.join([
              "      const isSimpleTelegramSso = url === SSO_ENDPOINT && !accessToken;",
              "      response = await fetch(url, {",
              "        method: 'POST',",
              "        cache: 'no-store',",
              "        headers: isSimpleTelegramSso",
              "          ? {",
              "              'Content-Type': 'text/plain;charset=UTF-8',",
              "              'Accept': 'application/json',",
              "            }",
              "          : Object.assign({",
              "              'Content-Type': 'application/json',",
              "              'Accept': 'application/json',",
              "              'apikey': PUBLISHABLE_KEY,",
              "            }, accessToken ? { 'Authorization': 'Bearer ' + accessToken } : {}),",
              "        body: JSON.stringify(body),",
              "      });",
          ])

          if old not in runtime:
              raise RuntimeError('Telegram runtime SSO fetch marker not found')
          runtime_path.write_text(runtime.replace(old, new, 1), encoding='utf-8')

          index_path = Path('_site/telegram/index.html')
          index = index_path.read_text(encoding='utf-8')
          old_version = 'studyjob_telegram_runtime.js?v=11.22.1'
          new_version = 'studyjob_telegram_runtime.js?v=11.22.3'
          if old_version not in index and new_version not in index:
              raise RuntimeError('Telegram runtime cache marker not found')
          index_path.write_text(index.replace(old_version, new_version), encoding='utf-8')
          PY
          grep -q 'isSimpleTelegramSso' _site/studyjob_telegram_runtime.js
          grep -q 'studyjob_telegram_runtime.js?v=11.22.3' _site/telegram/index.html
          grep -q 'studyjob_first_launch.js?v=1' _site/telegram/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website only
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
