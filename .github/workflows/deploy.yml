name: Deploy Study Job Web

# Manual no-op touch: force Pages to deploy the latest compiled ZIP.
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deploy repository
        uses: actions/checkout@v4

      - name: Unpack ready Study Job web build
        run: |
          rm -rf _site
          mkdir -p _site
          unzip -q StudyJob_WEB_READY.zip -d _site
          touch _site/.nojekyll
          test -f _site/index.html
          test -f _site/main.dart.js

      - name: Overlay Telegram Mini App files
        run: |
          mkdir -p _site/telegram
          cp telegram/index.html _site/telegram/index.html
          cp studyjob_telegram_runtime.js _site/studyjob_telegram_runtime.js
          test -f _site/telegram/index.html
          test -f _site/studyjob_telegram_runtime.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website only
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
