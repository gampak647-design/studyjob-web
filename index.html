  <meta name="apple-mobile-web-app-capable" content="yes">

  <link rel="icon" type="image/png" href="favicon.png">

  <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
  <script src="studyjob_telegram.js?v=11.23-auth-isolation" defer></script>

  <script src="studyjob_ocr.js?v=picker8_warm1800_20260830" defer></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f8fbff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      html, body { background: #101216; }
    }

    #studyjob-web-loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 36%, rgba(0, 122, 255, .13), transparent 34%),
        #f8fbff;
      transition: opacity .28s ease, visibility .28s ease;
    }

    @media (prefers-color-scheme: dark) {
      #studyjob-web-loader {
        background:
          radial-gradient(circle at 50% 36%, rgba(0, 122, 255, .18), transparent 34%),
          #101216;
        color: #f8f9ff;
      }
    }

    #studyjob-web-loader.done {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .studyjob-loader-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      transform: translateY(-2vh);
    }

    .studyjob-loader-logo {
      width: 104px;
      height: 104px;
      object-fit: contain;
      filter: drop-shadow(0 18px 32px rgba(0, 91, 255, .18));
    }

    .studyjob-loader-title {
      margin: 0;
      font-size: 23px;
      font-weight: 800;
      letter-spacing: -.02em;
    }

    .studyjob-loader-line {
      width: 92px;
      height: 4px;
      border-radius: 99px;
      overflow: hidden;
      background: rgba(100, 110, 140, .15);
    }

    .studyjob-loader-line::after {
      content: "";
      display: block;
      width: 45%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #1546ff, #00c8ff);
      animation: studyjob-loading 1s ease-in-out infinite alternate;
    }

    @keyframes studyjob-loading {
      from { transform: translateX(-10%); }
      to { transform: translateX(130%); }
    }
  </style>
</head>
<body>
  <div id="studyjob-web-loader" aria-label="Study Job загружается">
    <div class="studyjob-loader-card">
      <img class="studyjob-loader-logo" src="icons/Icon-512.png" alt="Study Job">
      <p class="studyjob-loader-title">Study Job</p>
      <div class="studyjob-loader-line" aria-hidden="true"></div>
    </div>
  </div>

  <script src="studyjob_bootstrap.js?v=e5080d6e" defer></script>
</body>
</html>
